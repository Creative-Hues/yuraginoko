<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a0f2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="水槽" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>ちいさな水槽</title>
  </head>
  <body>
    <canvas id="tank"></canvas>
    <button id="tank-button" class="pill" type="button" hidden></button>
    <button id="clean-button" class="corner-btn" type="button" aria-label="掃除" aria-pressed="false" hidden>
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <rect x="7" y="17" width="34" height="20" rx="6" fill="#ffd23b" stroke="#120a1c" stroke-width="3.5" />
        <rect x="7" y="11" width="34" height="9" rx="4" fill="#3de8a0" stroke="#120a1c" stroke-width="3.5" />
        <circle cx="15" cy="27" r="2.4" fill="#c9971c" />
        <circle cx="25" cy="31" r="2" fill="#c9971c" />
        <circle cx="32" cy="25" r="2.6" fill="#c9971c" />
        <circle cx="20" cy="33" r="1.6" fill="#c9971c" />
      </svg>
    </button>
    <button id="edit-button" class="corner-btn top" type="button" aria-label="環境を変える" aria-pressed="false" hidden>
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 30 C24 22 23 17 24 12" fill="none" stroke="#120a1c" stroke-width="7" stroke-linecap="round" />
        <path d="M24 30 C24 22 23 17 24 12" fill="none" stroke="#3de8a0" stroke-width="3" stroke-linecap="round" />
        <path d="M24 20 C17 21 12 17 11 11 C18 10 23 13 24 20 Z" fill="#c6ff3d" stroke="#120a1c" stroke-width="3" stroke-linejoin="round" />
        <path d="M24 16 C30 17 35 13 37 7 C30 6 25 9 24 16 Z" fill="#3de8a0" stroke="#120a1c" stroke-width="3" stroke-linejoin="round" />
        <path d="M11 29 H37 L34 42 H14 Z" fill="#ff6fcf" stroke="#120a1c" stroke-width="3.5" stroke-linejoin="round" />
        <rect x="9" y="26" width="30" height="6" rx="2" fill="#ff9be0" stroke="#120a1c" stroke-width="3.5" />
      </svg>
    </button>
    <button id="home-button" class="pill bottom" type="button" hidden>すみかを決める</button>
    <button id="request-button" class="pill request" type="button" hidden>おねがいが届いています</button>
    <div id="peek-bar" hidden>
      <button id="peek-back" class="pill" type="button">もどる</button>
      <span id="peek-text" class="peek-text"></span>
    </div>
    <div id="edit-ui" hidden></div>
    <div id="observe-ui" hidden></div>
    <div id="overlay"></div>
    <div id="rotate" aria-live="polite">
      <div class="phone" aria-hidden="true"></div>
      <p>スマホを横向きにすると、<br />水槽が見られます</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
